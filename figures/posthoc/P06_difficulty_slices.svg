<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620"><style>.t{font:700 25px system-ui;fill:#0f172a}.s{font:15px system-ui;fill:#475569}.l{font:12px system-ui;fill:#1e293b}</style><rect width="1200" height="620" fill="#f8fafc"/><text x="30" y="40" class="t">P06 Difficulty slices</text><text x="30" y="67" class="s">This is post-release exploratory diagnostic analysis over qualification outcomes. It does not reopen the closed v2 scientific program, does not establish efficacy, and does not alter V2_PRE_FREEZE_INSUFFICIENT_POWER_CALIBRATED.</text><rect x="190.0" y="370.0" width="109.6" height="130.0" fill="#64748b"/><rect x="301.6" y="110.0" width="109.6" height="390.0" fill="#0f766e"/><text x="190.0" y="525" class="l" text-anchor="end" transform="rotate(-45 190.0 525)">easy</text><rect x="500.0" y="279.5" width="109.6" height="220.5" fill="#64748b"/><rect x="611.6" y="260.9" width="109.6" height="239.1" fill="#0f766e"/><text x="500.0" y="525" class="l" text-anchor="end" transform="rotate(-45 500.0 525)">hard</text><rect x="810.0" y="267.5" width="109.6" height="232.5" fill="#64748b"/><rect x="921.6" y="230.0" width="109.6" height="270.0" fill="#0f766e"/><text x="810.0" y="525" class="l" text-anchor="end" transform="rotate(-45 810.0 525)">medium</text><rect x="30" y="100" width="15" height="15" fill="#64748b"/><text x="52" y="113" class="l">B2</text><rect x="30" y="123" width="15" height="15" fill="#0f766e"/><text x="52" y="136" class="l">C1</text><text x="30" y="602" class="s">POSTHOC EXPLORATORY — qualification only.</text></svg>
